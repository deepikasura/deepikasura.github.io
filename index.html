<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>deeps.core</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div id="loader">
    <h1>deeps.core</h1>
    <p>loading memories...</p>
</div>


<section class="hero">

    <h1>deeps.core</h1>

    <p>
        For the ones who romanticise everything...
        <br><br>
        
    </p>

    <div class="scroll">

</section>


<section class="quote">

</section>



<section class="gallery">

<img src="Photos/photo1.webp">

</div>

<div class="photo-card">
<img src="Photos/photo2.jpg">
<p>The fav Wall.</p>
</div>

<div class="photo-card">
<img src="Photos/photo5.jpg">
<p>The smile.</p>
</div>
    
<div class="photo-card">
<img src="Photos/img12.jpg">
<p>The terrace.</p>
</div>

<div class="photo-card">
<img src="Photos/img124.jpg">
<p>The urge to fly away.</p>
</div>

</section>
    



<section class="music">

    <h2>Now playing...</h2>

    <p>
        🎧
    </p>





<footer>
    made with memories ♡
</footer>


<script src="script.js"></script>

<audio id="bgMusic" loop>
    <source src="music/song.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

document.addEventListener("click", function () {
    music.play();
}, { once: true });
</script>
