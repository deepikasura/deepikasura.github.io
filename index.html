<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>deeps.core</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div id="loader">
    <h1>deeps.core</h1>
    <p>loading memories...</p>
</div>


<section class="hero">

    <h1>deeps.core</h1>

    <p>
        For the ones who romanticise everything...
        <br><br>
        even healing.
    </p>

    <div class="scroll">
        Scroll ↓
    </div>

</section>


<section class="quote">

    Some moments are too gentle to stay in our hands,
    so we let them live here.

</section>



<section class="photo">

    <div class="photo-card">

        <img src="Photos/photo1.webp">

        <p>
            The first page of my story.
        </p>

    </div>

</section>



<section class="music">

    <h2>Now playing...</h2>

    <p>
        My favourite memory soundtrack 🎧
    </p>


    <audio controls>
        <source src="music/song.mp3" type="audio/mp3">
    </audio>

</section>



<footer>
    made with memories ♡
</footer>


<script src="script.js"></script>

</html>
